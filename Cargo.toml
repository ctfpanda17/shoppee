[package]
name = "shoppee-core"
version = "0.3.0"
edition = "2021"
rust-version = "1.99"
description = "Authorized purchase preparation and reproducible latency diagnostics"
license = "MIT"

[dependencies]
anyhow = "1"
axum = "0.8"
clap = { version = "4", features = ["derive"] }
httpdate = "1"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2", "json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full", "test-util"] }
url = "2"
webbrowser = "1"

[profile.release]
lto = false
codegen-units = 1
